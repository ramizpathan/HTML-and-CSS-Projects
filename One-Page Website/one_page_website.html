<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favorite Animals</title>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#video">Video</a></li>
        </ul>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My Favorite Animals</h1>
        <p>This page shares my love for some amazing animals from around the world.</p>
    </section>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Animal Gallery</h2>
        <img src="lion.jpg" alt="Lion" width="300">
        <img src="penguin.jpg" alt="Penguin" width="300">
        <img src="elephant.jpg" alt="Elephant" width="300">
    </section>

    <!-- Contact Form Section -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message"></textarea><br><br>

            <input type="submit" value="Send">
        </form>
    </section>

    <!-- Video Section -->
    <section id="video">
        <h2>Watch a Cool Animal Video</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/aqvOVGCt5lw" frameborder="0" allowfullscreen></iframe>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 My Favorite Animals</p>
    </footer>

</body>
</html>
